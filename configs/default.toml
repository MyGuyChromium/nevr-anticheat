# NEVR-Anticheat default configuration
#
# This file is the reference for every key the binaries read. It is identical
# to config.DefaultConfig() (tests/config-docs_config_test.go enforces that),
# so running without --config behaves exactly like running with this file.
#
# HOW OVERRIDES WORK
#   A config file is overlaid onto these defaults KEY BY KEY. A partial
#   [detector.X] section keeps the default mode, weight and params; a
#   [detector.X.params] section changes only the keys it names. Copy this
#   file, or write a short file containing just the keys you want to change.
#
# STRICTNESS
#   Unknown keys, unknown detector IDs, unknown params and wrong value types
#   are startup ERRORS. Keys that earlier versions documented but no code
#   reads are dropped with a WARNING (see "Renamed and removed keys" at the
#   end). To verify an edit took effect read the effective per-detector table:
#   nevr-server always reports it at startup; nevr-ac only with --verbose / -v
#   or NEVR_AC_VERBOSE=1. With log_format = "json" it is one JSON log record
#   per detector ("msg":"effective detector"); with "text" a plain block.
#
# UNITS
#   Stated per key. "frames" are telemetry ticks (the bridge polls at ~15 Hz;
#   a replay carries whatever rate it recorded), never milliseconds.
#
# VALIDATION STATUS
#   No detector has been validated against labelled real Echo VR telemetry.
#   Every threshold still needs calibration. All detectors ship in shadow
#   mode, so observations cannot affect scores or cases until explicitly
#   promoted after labelled-data review.

# =============================================================================
# General
# =============================================================================
[general]
log_level   = "info"                 # debug | info | warn | error
log_format  = "json"                 # json | text (logs go to stderr)
max_workers = 4                      # parallel workers for `nevr-ac batch` (parse + per-worker detection)
db_path     = "./nevr-anticheat.db"  # SQLite file (WAL mode; .db-wal/.db-shm sidecars appear next to it)

# =============================================================================
# Game physics constants
# Copied onto every MatchContext (config.PhysicsConfig.Constants()) and read by
# the detectors: THROW_001 (disc_speed_cap), MOV_001 burst cap and MOV_004
# (max_player_speed / boost_speed_cap), STATE_002/STATE_005 (stun_duration /
# shield_cooldown as evidence reference), goal-directed throw features
# (goal_z). Arena extents are not configurable (X 15 m, Y 15 m, Z 154 m).
# A warning is logged when these differ from the engine defaults.
# =============================================================================
[physics]
disc_speed_cap   = 18.9     # m/s, engine-enforced maximum disc speed
boost_speed_cap  = 5.0      # m/s, speed gained by one boost
max_player_speed = 55.0     # m/s, hard cap for player movement (MOV_001 burst branch)
max_throw_speed  = 18.9     # m/s, reference only
stun_duration    = 3.0      # s, reference for STATE_002 evidence
shield_cooldown  = 5.0      # s, reference for STATE_005 evidence
immunity_window  = 1.5      # s, post-respawn immunity (reference)
grab_range       = 0.8      # legacy unused reference; NOT the disc-grab legality rule
goal_z           = 36.078   # m, |Z| of both goal centres; confirmed from a real replay

# Owner-supplied rules pending engine/build, geometry and measurement validation.
# Uncertainty never expands the inclusive 0.25 m legal boundary.
[project_rules]
version = "owner-2026-09-08-v1"
disc_grab_limit_m = 0.25
fast_throw_speed_mps = 19.0
required_movement_mps = 4.7

# =============================================================================
# Pipeline
# =============================================================================
[pipeline]
history_window                     = 30     # frames of kinematic history kept per player
min_frame_dt                       = 0.01   # s, frames with 0 < dt < min/2 are rejected (dt_out_of_range)
# max_frame_dt is the FEATURE EXTRACTOR's gap threshold, not a rejection bound:
# a known dt above it is a gap (raw state updated, kinematics and histories
# cleared, nothing derived across it) and it is the upper bound of the dt clamp
# used for finite differences. The validator rejects a frame only when dt > 60 s
# (pipeline.MaxProducerDt, a clock jump); dt <= 0 means unknown (first frame).
max_frame_dt                       = 0.5    # s, gap threshold and dt clamp upper bound; must be <= 60
max_events_per_player_per_detector = 100    # incidents kept per (player, detector) per match; later ones are dropped
high_ping_threshold_ms             = 150    # ms, players above this get PlayerState.IsHighPing (confidence reduction)
cooldown_frames                    = 300    # frames between scored events of the same detector for one player (jittered +-50, floor 100)

# =============================================================================
# Scoring
# A scored event contributes severity * confidence * enforcement_weight * 100,
# capped at max_single_contribution, at most max_contrib_per_detector_per_match
# events per detector per match, diminished for repeat events in one category.
# The per-match score is NOT decayed; decay_half_life_hours is applied by
# cross-match aggregation (`nevr-ac cross-match`, player-history) anchored on
# match time. Shadow events never contribute.
# =============================================================================
[scoring]
decay_half_life_hours              = 168.0  # h, cross-match decay half-life (7 days)
review_threshold                   = 60.0   # score at which a review case is created; this IS the high_risk boundary
auto_enforce_threshold             = 95.0   # score for the strongest recommendation (SuspicionScore.ExceedsAutoEnforce)
min_matches_for_cross_match        = 3      # distinct matches with events before a player is aggregated (floor 2)
max_single_contribution            = 15.0   # points, cap per event
max_contrib_per_detector_per_match = 2      # events per detector per match that score
correlation_bonus_cap              = 15.0   # points, cap on the (categories-1)*5 multi-category bonus
same_category_diminishing          = 0.8    # factor applied per prior event in the same category

# Tier boundaries (inclusive lower bounds on the 0-100 score). They populate
# model.LevelTable; review_threshold overrides high_risk when the two differ.
informational = 20.0   # visible in dashboards
suspicious    = 40.0   # monitoring
high_risk     = 60.0   # moderator review queue (= review_threshold)
critical      = 80.0   # urgent review
action_worthy = 95.0   # action recommended with hard evidence

# =============================================================================
# Baseline modelling  (EXPERIMENTAL / UNUSED)
# No BaselineProvider implementation is wired; these keys are parsed and
# validated but nothing reads them. Kept so files that carry the section load.
# =============================================================================
[baseline]
min_baseline_matches     = 10
baseline_update_interval = 5
player_baseline_weight   = 0.3

# =============================================================================
# Shadow mode
# shadow_detectors is an ADDITIONAL list of detector IDs forced into shadow
# mode. It does not override a per-detector mode = "shadow" (the normal case)
# and an empty list overrides nothing; safety rests on each detector's mode.
# =============================================================================
[shadow]
shadow_detectors = []

# =============================================================================
# Live ingestion server (nevr-server)
# Limit/listener flags override this section. Source grants are operator policy.
# Remote ingestion requires source_grants; secrets live in each token_env named
# environment variable, never in TOML. See docs/telemetry-source-grants.md.
# =============================================================================
[server]
source_grants            = []        # remote listeners fail closed without grants; see docs/telemetry-source-grants.md
listen                    = ":8080"   # telemetry WebSocket (/telemetry) and /health
metrics                   = ":9090"   # Prometheus text exposition at /metrics
allow_unauthenticated     = false     # literal-loopback development only; never expose through a proxy/port forward
max_matches               = 64        # concurrently tracked live matches
max_players_per_match     = 16
max_connections           = 100       # concurrent producer connections
max_message_bytes         = 1048576   # carries a bounded raw /session snapshot plus normalized frames; larger messages are discarded
max_frame_rate_per_player = 30        # sustained frames/s per player; a backlog of at least 10 s of frames (a bridge replaying after a link hiccup) is accepted, only excess beyond that is rejected and not stored
# Durations MUST be strings ("300s", "5m"). A bare number is a startup error:
# it would be read as nanoseconds, and idle_timeout = 300 (300 ns) would
# disconnect every producer on its first read.
idle_timeout              = "5m"      # a producer silent this long is disconnected (>= 1s)
stale_match_after         = "30m"     # a live match idle this long is finalized (>= 1s)
persist_interval          = "2m"      # how often a live match context is re-persisted (>= 1s)

# =============================================================================
# Detectors
# Per detector: enabled, enforcement_weight (0-1, multiplies every event's
# score contribution), auto_enforce (lets the detector stamp AutoEnforce on
# qualifying events; only THROW_001 has such a rule), mode ("shadow" = stored
# with is_shadow=1, never scored; "review"/"enforce" both mean scored) and
# params. Every params key below is read by the detector; the effective table
# printed at startup shows the resolved values.
# =============================================================================

# ----------------------------------------------------------------------------- throw

[detector.THROW_001]
# Impossible Release Velocity. PHYSICS_GROUNDED: the 18.9 m/s cap is a real
# engine constant. Release speed comes directly from disc.velocity, so ping
# does not enlarge the cap. Optional tolerances default to zero.
# Releases above 2x the cap are reported as anomaly disc_speed_artifact at
# severity 0.2 (timing artifact vs injection is unresolved on real data).
# Repeatable throws at or below the cap are legal and never produce a signal.
enabled            = true
enforcement_weight = 0.8
auto_enforce       = false   # keep off until the 22-96 m/s over-cap events in the calibration DB are explained
mode               = "shadow"
[detector.THROW_001.params]
base_tolerance             = 0.0    # optional m/s added to physics.disc_speed_cap
ping_tolerance_scalar      = 0.0    # optional legacy m/s per second of estimated ping
max_speed_ratio            = 3.0    # release/cap ratio at which severity saturates
sigmoid_steepness          = 2.0

[detector.THROW_002]
# Impossible Disc Acceleration. UNVERIFIED: v2.0.0 single-delta approach
# (last pre-release disc speed vs release speed), needs real-data calibration.
# The BROKEN multi-frame acceleration mechanism was removed in 3ab978b; the
# replacement is unvalidated and the "identical pre-release velocities"
# finding must be re-tested now that snapshots exclude the release frame.
enabled            = false
enforcement_weight = 0.7
mode               = "shadow"
[detector.THROW_002.params]
max_speed_delta = 22.0   # m/s, max jump from pre-release speed to release speed

[detector.THROW_003]
# Unnatural Release Angle. UNVERIFIED: needs the real wrist-flick distribution.
enabled            = true
enforcement_weight = 0.5
mode               = "shadow"
[detector.THROW_003.params]
max_release_angle_deviation = 177.0  # deg between hand velocity and disc velocity
min_hand_speed              = 3.0    # m/s
min_throw_speed             = 5.0    # m/s

[detector.THROW_004]
# Repeated Release Signatures. UNSAFE: regrab playstyle produces low variance
# naturally; with the 1e-8 threshold even varied human throws fire.
enabled            = false
enforcement_weight = 0.6
mode               = "shadow"
[detector.THROW_004.params]
min_throws               = 12      # throws before the 6-dim signature variance is evaluated
min_generalized_variance = 1e-8    # generalized variance below which signatures are identical

[detector.THROW_005]
# Shot Targeting Review. Bounded statistics include misses/non-goal releases.
# Accuracy has no cheating cutoff and never produces a scored detection.
enabled            = true
enforcement_weight = 0.0
mode               = "shadow"
[detector.THROW_005.params]

[detector.THROW_006]
# Free-flight Trajectory Review. NOT a disc-grab reach check.
# Angle thresholds are UNVERIFIED. Requires 5 sustained unusual
# frames (code constant) and 5 tracked frames.
enabled            = true
enforcement_weight = 0.0
mode               = "shadow"
[detector.THROW_006.params]
min_trajectory_change     = 8.0    # deg per frame counted as a bend
post_release_frames       = 15     # frames tracked after release
min_distance_from_thrower = 2.0    # m before bends count
max_cumulative_change     = 130.0  # deg, completed-window sampled anomaly filter; no scored output

[detector.THROW_007]
# Penalty Field Tampering. STUB: Evaluate() returns nil; no penalty-field
# telemetry exists. Params are parsed but unused.
enabled            = false
enforcement_weight = 0.6
mode               = "shadow"
[detector.THROW_007.params]
expected_penalty_speed_loss = 0.5
penalty_tolerance           = 0.1
min_entry_speed             = 5.0

[detector.THROW_008]
# Speed-Distance Anomaly. UNVERIFIED: arena physics interactions unvalidated.
enabled            = true
enforcement_weight = 0.5
mode               = "shadow"
[detector.THROW_008.params]
speed_increase_tolerance = 5.0   # m/s allowed speed increase in free flight
max_tracking_frames      = 30    # frames tracked after release

# ----------------------------------------------------------------------------- bio

[detector.BIO_001]
# Impossible Wrist Rotation. UNVERIFIED: hand rotations come from Echo VR
# direction vectors; the handedness convention is unconfirmed. The wrist-rate
# metric saturates at pi/dt = 46.9 rad/s on 15 Hz telemetry, so the 50 rad/s
# threshold is UNREACHABLE on bridge data (observation only there).
enabled            = true
enforcement_weight = 0.6
mode               = "shadow"
[detector.BIO_001.params]
max_wrist_angular_velocity = 50.0   # rad/s
min_violation_frames       = 3      # frames; the code floors this at 3
sigmoid_steepness          = 8.5

[detector.BIO_002]
# Impossible Hand Speed. PHYSICS_GROUNDED: the player-relative controller
# speed removes body translation; 50 m/s is ~4x the human limit.
enabled            = true
enforcement_weight = 0.6
mode               = "shadow"
[detector.BIO_002.params]
max_hand_speed       = 50.0   # m/s relative to player translation
min_violation_frames = 2      # frames; the code floors this at 3
sigmoid_steepness    = 8.5

[detector.BIO_003]
# Zero Hand Jitter. UNVERIFIED: controller jitter baseline unknown.
enabled            = true
enforcement_weight = 0.5
mode               = "shadow"
[detector.BIO_003.params]
max_jitter_variance     = 0.00001  # m^2, variance below which the hand is too still
jitter_window_frames    = 90       # frames (~6 s at 15 Hz)
min_active_frames       = 60       # active frames required inside the window
severity_decades        = 2.0      # decades below the threshold that saturate severity
min_consecutive_windows = 2        # consecutive zero-jitter windows before an event

[detector.BIO_004]
# Zero Aim Wobble. UNVERIFIED: same rotation dependency as BIO_001, wobble
# baseline unknown.
enabled            = true
enforcement_weight = 0.5
mode               = "shadow"
[detector.BIO_004.params]
max_wobble_variance     = 0.00005  # rotation variance below which aim is too steady
wobble_window_frames    = 90       # frames
min_active_frames       = 60       # active frames required inside the window
severity_decades        = 2.0
min_consecutive_windows = 2

# ----------------------------------------------------------------------------- movement

[detector.MOV_001]
# Impossible Player Speed. PHYSICS_GROUNDED: median-filtered sustained speed;
# the burst branch uses max(max_legitimate_speed, physics.max_player_speed).
enabled            = true
enforcement_weight = 0.7
mode               = "shadow"
[detector.MOV_001.params]
max_legitimate_speed   = 55.0   # m/s sustained (median) speed cap
sustained_speed_window = 30     # frames in the median window
sigmoid_steepness      = 0.5
min_burst_frames       = 5      # frames above the burst cap before a burst event

[detector.MOV_002]
# Teleportation. PHYSICS_GROUNDED but network-desync behaviour UNVERIFIED.
# Jumps above max_displacement are treated as resets and ignored; simultaneous
# teleports by min_solo_teleporters players and the goal cooldown suppress
# game events.
enabled            = true
enforcement_weight = 0.8
auto_enforce       = false
mode               = "shadow"
[detector.MOV_002.params]
teleport_threshold       = 8.0    # m jump between consecutive frames
velocity_mismatch_factor = 3.0    # jump must exceed velocity * dt by this factor
max_frame_gap            = 5      # frames; larger gaps are not compared
sigmoid_steepness        = 0.5
min_solo_teleporters     = 2      # simultaneous teleporters that mean a game event
cluster_window           = 60     # frames for the distinct-player cluster suppression
goal_cooldown_frames     = 150    # frames after a score change during which jumps are ignored
max_displacement         = 12.0   # m; larger jumps are resets, not teleports
min_incidents            = 5      # incidents per player before an event

[detector.MOV_003]
# Zero-Inertia Direction Change. UNSAFE: wall bounces and collisions produce
# legitimate reversals.
enabled            = false
enforcement_weight = 0.5
mode               = "shadow"
[detector.MOV_003.params]
min_angle_deg         = 175.0  # deg reversal angle
min_speed             = 12.0   # m/s before and after
stun_cooldown_frames  = 30     # frames after a stun during which reversals are ignored
sigmoid_steepness     = 0.5
confirm_frames        = 3      # frames the new heading must persist
heading_tolerance_deg = 20.0   # deg drift tolerated during confirmation
collision_radius      = 2.0    # m; another player this close explains the reversal

[detector.MOV_004]
# Boost Speed Cap Violation. TELEMETRY_DEPENDENT: needs is_boosting, which no
# known source supplies. The cap is physics.boost_speed_cap.
enabled            = false
enforcement_weight = 0.5
mode               = "shadow"
[detector.MOV_004.params]
boost_cap_margin  = 1.5   # m/s above physics.boost_speed_cap
sigmoid_steepness = 0.8

[detector.MOV_005]
# Boost Spam. TELEMETRY_DEPENDENT: needs is_boosting. Counts boost
# ACTIVATIONS (rising edges), not boosting frames.
enabled            = false
enforcement_weight = 0.6
mode               = "shadow"
[detector.MOV_005.params]
window_seconds        = 10.0   # s sliding window
max_boosts_per_window = 25     # activations allowed per window
max_consecutive       = 5      # consecutive activations without a recharge pause
recharge_pause_frames = 10     # frames of pause that close a sequence
min_sequences         = 2      # suspicious sequences before an event
sigmoid_steepness     = 0.5

[detector.MOV_006]
# Physical Playspace Walking. EchoTools-grounded: subtracts Echo VR's raw
# player.velocity from tracked rig motion, separating room-scale steps from
# ordinary locomotion and stacking. Feet/guardian origin are unavailable, so
# a legal lean or lunge cannot be excluded automatically. Strict gates reduce
# noise, but this remains a shadow-only review candidate.
# Temporarily paused in this build, including older enabled=true overrides.
enabled            = false
enforcement_weight = 0.75
auto_enforce       = false
mode               = "shadow"
[detector.MOV_006.params]
min_playspace_speed    = 1.0    # m/s game-velocity-subtracted rig speed
min_playspace_distance = 0.55   # m accumulated room-scale displacement
min_observed_pose_speed = 0.35  # m/s actual rig motion; frozen remote poses cannot qualify
min_rig_coherence      = 0.65   # head/hand translation agreement [0,1]
min_sustained_frames   = 5      # minimum consecutive qualifying samples
min_sustained_seconds  = 0.3    # real elapsed duration; avoids tick-rate-dependent bursts
max_ping_ms            = 150.0  # skip less trustworthy samples above this latency; 0 disables

# ----------------------------------------------------------------------------- state

[detector.STATE_001]
# Disc Grab Geometry Review (Mags). Project limit is separate from uncertainty.
# Unknown acquisition geometry/rule validity produces inconclusive, never extra reach.
enabled            = true
enforcement_weight = 0.0
mode               = "shadow"
[detector.STATE_001.params]

[detector.STATE_002]
# Stun Recovery Exploit. PHYSICS_GROUNDED: stun duration is a game mechanic;
# the real duration in telemetry frames is UNVERIFIED. min_stun_frames is
# converted to seconds with the match tick rate; min_stun_seconds > 0 overrides.
enabled            = true
enforcement_weight = 0.7
mode               = "shadow"
[detector.STATE_002.params]
min_stun_frames   = 20     # frames, shortest legitimate stun
min_stun_seconds  = 0.0    # s; 0 = derive from min_stun_frames
min_incidents     = 2      # short stuns before an event
sigmoid_steepness = 0.2

[detector.STATE_003]
# Shield Duration Abuse. TELEMETRY_DEPENDENT: needs shield_active.
enabled            = false
enforcement_weight = 0.6
mode               = "shadow"
[detector.STATE_003.params]
suspicious_frames = 300    # frames (~20 s at 15 Hz)
high_frames       = 375    # frames (~25 s)
impossible_frames = 600    # frames (~40 s)
sigmoid_steepness = 0.02

[detector.STATE_004]
# Damage Immunity Exploit. TELEMETRY_DEPENDENT: needs is_immune.
enabled            = false
enforcement_weight = 0.8
mode               = "shadow"
[detector.STATE_004.params]
max_immune_frames          = 225   # frames of active immunity before an event
escalation_interval_frames = 0     # frames between re-fires; 0 = max_immune_frames / 2
sigmoid_steepness          = 8.0

[detector.STATE_005]
# Cooldown Bypass. TELEMETRY_DEPENDENT: needs shield_active.
enabled            = false
enforcement_weight = 0.6
mode               = "shadow"
[detector.STATE_005.params]
min_cooldown_frames  = 60     # frames, converted with the tick rate
min_cooldown_seconds = 0.0    # s; 0 = derive from min_cooldown_frames
min_violations       = 15     # violations before an event
sigmoid_steepness    = 0.05

[detector.STATE_006]
# Score Manipulation. SUSPENDED: real profiler data proved delta=1 is
# legitimate and no impossible score delta has been confirmed. Evaluate()
# returns nil; there are no params.
enabled            = false
enforcement_weight = 1.0
auto_enforce       = false
mode               = "shadow"

[detector.STATE_007]
# Impossible Punch Range. TELEMETRY_DEPENDENT: per-frame stun-count
# granularity is unconfirmed (if stats update only at round end the detector
# is dead).
enabled            = false
enforcement_weight = 0.5
mode               = "shadow"
[detector.STATE_007.params]
punch_range_threshold     = 10.0   # m puncher-to-victim
velocity_adjust_scale     = 0.15   # s of closing-velocity credit
min_incidents             = 3      # incidents before an event
sigmoid_steepness         = 1.0
attribution_window_frames = 2      # frames a stun start may lag the punch
max_range                 = 25.0   # m; beyond this the attribution failed

[detector.STATE_008]
# Pre-catch Trajectory Review. OBSERVATION_ONLY: these engineering filters are
# provisional, not verified catch physics or a calibrated cheat signature.
# This detector cannot be promoted to scoring or automatic enforcement.
enabled            = true
enforcement_weight = 0.0
auto_enforce       = false
mode               = "shadow"
[detector.STATE_008.params]
baseline_samples           = 4      # free-flight baseline samples
min_correction_samples     = 2      # consecutive approach corrections
baseline_duration_s        = 0.20   # s; minimum reference span as well as sample floor
min_correction_duration_s  = 0.12   # s; sustained turning as well as sample floor
min_turn_rate_deg_s        = 60.0   # deg/s; provisional correction rate
max_turn_rate_deg_s        = 300.0  # deg/s; larger turns are ambiguous
max_sample_gap_s           = 0.12   # s; reject larger adjacent sample gaps
max_window_s               = 1.5    # s; maximum pre-catch window
max_step_error_m           = 0.20   # m; displacement/velocity consistency
min_lateral_deviation_m    = 0.30   # m; deviation from baseline trajectory
contact_accel_allowance_mps2 = 30.0 # m/s^2; provisional envelope, not a measured legal bound
contact_margin_m           = 0.65   # m; possible-contact exclusion, not a game radius
min_miss_improvement_m     = 0.50   # m; projected miss-distance improvement
max_catch_approach_m       = 1.5    # m; last-free-sample hand distance
regrab_grace_s             = 0.35   # s; exclude rapid regrabs

# ----------------------------------------------------------------------------- pattern

[detector.PAT_001]
# Frame-Perfect Timing. UNSAFE: regrab rhythm produces low CoV naturally.
enabled            = false
enforcement_weight = 0.6
mode               = "shadow"
[detector.PAT_001.params]
max_cov           = 0.05   # coefficient of variation of inter-throw intervals
max_stddev        = 3.0    # frames
min_throw_count   = 12     # throws before evaluation (clamped to [3, 50])
sigmoid_steepness = 20.0

[detector.PAT_002]
# Identical Release Points. UNSAFE: consistent form produces tight spreads.
enabled            = false
enforcement_weight = 0.6
mode               = "shadow"
[detector.PAT_002.params]
min_release_spread = 0.01   # m body-frame spread below which points are identical
min_throw_count    = 12
min_release_speed  = 0.0    # m/s; releases slower than this are not sampled (0 = sample all)
sigmoid_steepness  = 50.0

[detector.PAT_003]
# Cross-Match Consistency. CROSS_MATCH_DEPENDENT: reads prior non-shadow,
# non-meta events from the DB (history_provider is injected by the binaries);
# produces nothing until min_matches of history exist. Enable after 3+ matches.
enabled            = false
enforcement_weight = 0.8
mode               = "shadow"
[detector.PAT_003.params]
min_matches        = 3      # prior matches with eligible events
min_avg_confidence = 0.6    # mean confidence of prior events required
match_limit        = 20     # most recent matches consulted
sigmoid_steepness  = 2.0
trusted_detectors  = []     # detector IDs whose history counts; empty = all non-shadow, non-meta

[detector.PAT_004]
# Composite Multi-Cheat. Meta-detector: fed with non-shadow events at
# confidence >= 0.7; accuracy depends entirely on upstream detectors.
enabled            = true
enforcement_weight = 0.9
mode               = "shadow"
[detector.PAT_004.params]
min_categories    = 3     # distinct detector categories in one match
sigmoid_steepness = 1.0

[detector.PAT_005]
# Playspace Abuse. PHYSICS_GROUNDED: 1.6 m is ~2x arm reach; sustained window.
# Temporarily paused with MOV_006; parameters retained for future review.
enabled            = false
enforcement_weight = 0.5
mode               = "shadow"
[detector.PAT_005.params]
hand_to_head_threshold = 1.6    # m
min_sustained_frames   = 30     # consecutive frames above the threshold
sigmoid_steepness      = 2.0

# =============================================================================
# Renamed and removed keys (accepted with a warning, then ignored)
# STATE_008 min_correction_angle_deg / max_turn_angle_deg -> removed; replaced by explicit time-based rate/duration controls, not numerically reinterpreted
# =============================================================================
# general.mode                                     -> ignored (binary decides)
