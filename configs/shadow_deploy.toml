# NEVR-Anticheat -- first live shadow deployment
#
# Purpose: initial shadow-mode deployment on a single community server.
# This file is an OVERLAY on configs/default.toml: every key not written here
# keeps its default (physics, pipeline, scoring tiers, detector params).
# Verify the merged result in the effective detector table: nevr-server
# reports it at every startup, nevr-ac only with --verbose / -v (or
# NEVR_AC_VERBOSE=1). With log_format = "json" it is one JSON log record per
# detector ("msg":"effective detector").
#
# WHAT THIS CONFIG PRODUCES
#   Every detector below runs in mode = "shadow". Shadow events are stored in
#   detection_events with is_shadow = 1 and are NEVER scored: the
#   suspicion_scores table stays empty, no review case is created, `nevr-ac
#   flagged` prints "No flagged players." and nothing is logged per event.
#   The output of a shadow deployment is the detection_events table; read it
#   with the SQL in docs/shadow_deployment_guide.md.
#
# CAVEATS
#   1. No threshold has been validated against real Echo VR telemetry.
#   2. BIO_001 cannot fire on 15 Hz bridge data (46.9 rad/s saturation < 50);
#      it is enabled to confirm the rotation pipeline is alive, not to detect.
#   3. PAT_003 stays disabled until 3+ matches of history exist.
#   4. enforcement_weight has no effect while mode = "shadow"; the weights
#      below are the values that WOULD apply once a detector is promoted.

[general]
log_level   = "info"                  # "debug" for the first match, then "info"
log_format  = "json"
max_workers = 2                       # parallel workers for `nevr-ac batch`
db_path     = "./nevr-ac-shadow.db"   # separate DB for the shadow deployment

[pipeline]
max_events_per_player_per_detector = 50   # lower than default to bound noise from a spamming detector

# [physics] and [scoring] are inherited from the defaults (18.9 m/s disc cap,
# review at 60 = high_risk). Nothing here is scored, so the scoring keys only
# matter for the offline `analyze` runs used to check a detector's behaviour.

# ==============================================================================
# Enabled, weight as it would apply after promotion (physics-grounded)
# ==============================================================================

[detector.THROW_001]
# Impossible Release Velocity: engine cap 18.9 m/s; direct velocity, no default tolerance.
enabled            = true
enforcement_weight = 0.8
auto_enforce       = false
mode               = "shadow"

[detector.THROW_006]
# Trajectory Correction (Mags): straight-line physics; angle thresholds UNVERIFIED.
enabled            = true
enforcement_weight = 0.8
auto_enforce       = false
mode               = "shadow"

[detector.BIO_002]
# Impossible Hand Speed: 50 m/s is ~4x the human limit.
enabled            = true
enforcement_weight = 0.6
auto_enforce       = false
mode               = "shadow"

[detector.MOV_001]
# Impossible Player Speed: median-filtered; 55 m/s is generous.
enabled            = true
enforcement_weight = 0.7
auto_enforce       = false
mode               = "shadow"

[detector.MOV_002]
# Teleportation: dual condition + 5-incident minimum; desync behaviour UNVERIFIED.
enabled            = true
enforcement_weight = 0.8
auto_enforce       = false
mode               = "shadow"

[detector.STATE_002]
# Stun Recovery Exploit: 2-incident minimum; real stun duration UNVERIFIED.
enabled            = true
enforcement_weight = 0.7
auto_enforce       = false
mode               = "shadow"

[detector.PAT_004]
# Composite Multi-Cheat: meta-detector over non-shadow events. With every
# upstream detector in shadow it receives nothing and cannot fire.
enabled            = true
enforcement_weight = 0.9
auto_enforce       = false
mode               = "shadow"

[detector.PAT_005]
# Playspace Abuse: 1.6 m hand-to-head sustained for 30 frames.
enabled            = true
enforcement_weight = 0.5
auto_enforce       = false
mode               = "shadow"

# ==============================================================================
# Enabled for observation only (weight 0.0): baseline data collection
# ==============================================================================

[detector.THROW_003]
enabled            = true
enforcement_weight = 0.0
mode               = "shadow"

[detector.THROW_005]
enabled            = true
enforcement_weight = 0.0
mode               = "shadow"

[detector.THROW_008]
enabled            = true
enforcement_weight = 0.0
mode               = "shadow"

[detector.BIO_001]
# Rotation-format probe. Cannot exceed 50 rad/s on 15 Hz data; if it fires at
# all on bridge data the rotation conversion is producing garbage.
enabled            = true
enforcement_weight = 0.0
mode               = "shadow"

[detector.BIO_003]
enabled            = true
enforcement_weight = 0.0
mode               = "shadow"

[detector.BIO_004]
enabled            = true
enforcement_weight = 0.0
mode               = "shadow"

[detector.STATE_001]
enabled            = true
enforcement_weight = 0.0
mode               = "shadow"

[detector.STATE_007]
# Validates whether per-frame stun counts update at all.
enabled            = true
enforcement_weight = 0.0
mode               = "shadow"

# ==============================================================================
# Disabled
# ==============================================================================

[detector.THROW_002]
enabled = false     # UNVERIFIED: v2.0.0 single-delta approach, needs real-data calibration (BROKEN mechanism removed, replacement unvalidated)
enforcement_weight = 0.0
mode    = "shadow"

[detector.THROW_004]
enabled = false     # UNSAFE: regrab playstyle produces false positives
mode    = "shadow"

[detector.THROW_007]
enabled = false     # STUB: no penalty-field telemetry
mode    = "shadow"

[detector.MOV_003]
enabled = false     # UNSAFE: wall bounces produce false positives
mode    = "shadow"

[detector.MOV_004]
enabled = false     # TELEMETRY_DEPENDENT: needs is_boosting
mode    = "shadow"

[detector.MOV_005]
enabled = false     # TELEMETRY_DEPENDENT: needs is_boosting
mode    = "shadow"

[detector.STATE_003]
enabled = false     # TELEMETRY_DEPENDENT: needs shield_active
mode    = "shadow"

[detector.STATE_004]
enabled = false     # TELEMETRY_DEPENDENT: needs is_immune
mode    = "shadow"

[detector.STATE_005]
enabled = false     # TELEMETRY_DEPENDENT: needs shield_active
mode    = "shadow"

[detector.STATE_006]
enabled = false     # SUSPENDED: no confirmed impossible score invariant
enforcement_weight = 1.0
auto_enforce = false
mode    = "shadow"

[detector.PAT_001]
enabled = false     # UNSAFE: rhythmic regrab produces false positives
mode    = "shadow"

[detector.PAT_002]
enabled = false     # UNSAFE: consistent throwing form produces false positives
mode    = "shadow"

[detector.PAT_003]
enabled = false     # CROSS_MATCH_DEPENDENT: enable at weight 0.0 after 3+ matches of history
enforcement_weight = 0.0
mode    = "shadow"
