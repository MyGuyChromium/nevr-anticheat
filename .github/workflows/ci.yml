name: CI

on:
  workflow_call:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Desktop assessment rendering regression tests
        run: node --test scripts/desktop-review.test.cjs

      - name: Release gate policy regressions
        run: node --test scripts/release-gate.test.cjs

      - name: Synthetic soak helper isolation regressions
        # Go ./... skips testdata; the security scanner does not.
        run: go test -race ./scripts/testdata

      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Workflow lint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color=false

      - name: Reachable vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Security static analysis
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -severity medium -exclude G201,G202,G204,G304 -nosec-require-justification -nosec-require-rules ./...

      - name: Test and enforce coverage floor
        run: |
          go test ./... -coverprofile=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')"
          echo "total statement coverage: ${total}%"
          # Go 1.26.6 reports 70.8% for this suite; Go 1.27 reports 73.8%
          # because its coverage instrumentation counts statements differently.
          awk -v total="$total" 'BEGIN { if (total + 0 < 70.0) exit 1 }'

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error

      - name: Race
        timeout-minutes: 15
        run: go test -race ./...
