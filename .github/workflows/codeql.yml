name: CodeQL

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "43 6 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # GitHub CodeQL is free for public repositories. This personal private
    # repository cannot upload results unless GitHub Code Security is enabled.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-extended
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
