name: Windows package

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Windows C cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip

      - name: Build Windows executables
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
        run: |
          set -euo pipefail
          package="dist/NEVR-Anticheat-Windows-x64"
          mkdir -p "$package/configs"
          go build -trimpath -ldflags "-s -w" -o "$package/nevr-desktop.exe" ./cmd/desktop
          go build -trimpath -ldflags "-s -w" -o "$package/nevr-ac.exe" ./cmd/anticheat
          go build -trimpath -ldflags "-s -w" -o "$package/nevr-server.exe" ./cmd/server
          go build -trimpath -ldflags "-s -w" -o "$package/nevr-bridge.exe" ./cmd/bridge
          go build -trimpath -ldflags "-s -w" -o "$package/nevr-compat.exe" ./cmd/compat
          cp README.md packaging/README-WINDOWS.txt "$package/"
          cp configs/default.toml configs/shadow_deploy.toml "$package/configs/"
          (cd dist && zip -r NEVR-Anticheat-Windows-x64.zip NEVR-Anticheat-Windows-x64)
          (cd dist && sha256sum NEVR-Anticheat-Windows-x64.zip > NEVR-Anticheat-Windows-x64.zip.sha256)

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEVR-Anticheat-Windows-x64
          path: |
            dist/NEVR-Anticheat-Windows-x64.zip
            dist/NEVR-Anticheat-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            if ! gh release view "$release_tag" >/dev/null 2>&1; then
              gh release create "$release_tag" --generate-notes --title "$release_tag"
            fi
          else
            release_tag="windows-latest"
            git tag --force "$release_tag" "$GITHUB_SHA"
            git push origin "refs/tags/$release_tag" --force
            if gh release view "$release_tag" >/dev/null 2>&1; then
              gh release edit "$release_tag" --latest --title "Latest Windows build" \
                --notes "Ready-to-run Windows x64 package from the latest successful master build. This rolling release is replaced after every merge to master."
            else
              gh release create "$release_tag" --latest --title "Latest Windows build" \
                --notes "Ready-to-run Windows x64 package from the latest successful master build. This rolling release is replaced after every merge to master."
            fi
          fi
          gh release upload "$release_tag" \
            dist/NEVR-Anticheat-Windows-x64.zip \
            dist/NEVR-Anticheat-Windows-x64.zip.sha256 \
            --clobber
