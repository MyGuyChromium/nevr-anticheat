name: Windows package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "cmd/**"
      - "configs/**"
      - "internal/**"
      - "packaging/**"
      - "scripts/**"
      - "go.mod"
      - "go.sum"
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Local calls use this workflow's exact commit. These mandatory checks have
  # no signing secrets or release-write permissions and cannot be skipped by
  # relying on a successful package or a different workflow run.
  quality_ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  quality_security:
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Windows C cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build branded Windows executables
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
        run: |
          set -euo pipefail
          package="dist/NEVR-Anticheat-Windows-x64"
          mkdir -p "$package/configs" "$package/installer"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          app_version="$(sed -n 's/^const appVersion = "\([0-9.]*\)"/\1/p' cmd/desktop/main.go)"
          test -n "$app_version"
          IFS=. read -r version_major version_minor version_patch <<< "$app_version"
          x86_64-w64-mingw32-windres -I . \
            -DNEVR_VERSION_MAJOR="$version_major" \
            -DNEVR_VERSION_MINOR="$version_minor" \
            -DNEVR_VERSION_PATCH="$version_patch" \
            packaging/nevr-version.rc -O coff -o cmd/desktop/resource_windows_amd64.syso

          go build -trimpath -ldflags "-s -w -X main.buildCommit=${GITHUB_SHA} -X main.buildTime=${build_time}" -o "$package/nevr-desktop.exe" ./cmd/desktop
          go build -trimpath -ldflags "-s -w" -o "$package/nevr-ac.exe" ./cmd/anticheat
          go build -trimpath -ldflags "-s -w" -o "$package/nevr-server.exe" ./cmd/server
          go build -trimpath -ldflags "-s -w" -o "$package/nevr-bridge.exe" ./cmd/bridge
          go build -trimpath -ldflags "-s -w" -o "$package/nevr-compat.exe" ./cmd/compat

          # Windows-only tests are excluded from Linux CI. Compile them with
          # the same toolchain as the shipped app, then run on Windows below.
          go test -c -o dist/nevr-desktop.test.exe ./cmd/desktop

          cp README.md packaging/README-WINDOWS.txt "$package/"
          cp configs/default.toml configs/shadow_deploy.toml "$package/configs/"
          cp packaging/Install-NEVR.cmd "$package/"
          cp packaging/Install-NEVR.ps1 packaging/Uninstall-NEVR.cmd packaging/Uninstall-NEVR.ps1 "$package/installer/"
          cp packaging/Rollback-NEVR.cmd packaging/Rollback-NEVR.ps1 "$package/installer/"
          cp packaging/Program-Snapshot.ps1 "$package/installer/"

      - name: Upload unsigned program files
        uses: actions/upload-artifact@v7
        with:
          name: nevr-windows-unsigned
          path: dist/NEVR-Anticheat-Windows-x64
          if-no-files-found: error

      - name: Upload Windows desktop test binary
        uses: actions/upload-artifact@v7
        with:
          name: nevr-windows-desktop-tests
          path: dist/nevr-desktop.test.exe
          if-no-files-found: error

  package:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Download program files
        uses: actions/download-artifact@v8
        with:
          name: nevr-windows-unsigned
          path: dist/NEVR-Anticheat-Windows-x64

      - name: Download Windows desktop tests
        uses: actions/download-artifact@v8
        with:
          name: nevr-windows-desktop-tests
          path: dist/desktop-tests

      - name: Run desktop tests on Windows
        shell: pwsh
        run: |
          Push-Location cmd/desktop
          try {
            & ..\..\dist\desktop-tests\nevr-desktop.test.exe '-test.timeout=5m'
            if ($LASTEXITCODE -ne 0) { throw "Windows desktop tests failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Select signing mode
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $pfxValues = @($env:WINDOWS_SIGNING_CERTIFICATE, $env:WINDOWS_SIGNING_PASSWORD)
          $artifactValues = @(
            $env:AZURE_CLIENT_ID, $env:AZURE_TENANT_ID, $env:AZURE_SUBSCRIPTION_ID,
            $env:ARTIFACT_SIGNING_ENDPOINT, $env:ARTIFACT_SIGNING_ACCOUNT, $env:ARTIFACT_SIGNING_PROFILE
          )
          $pfxCount = @($pfxValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          $artifactCount = @($artifactValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($pfxCount -ne 0 -and $pfxCount -ne $pfxValues.Count) { throw "The PFX signing configuration is incomplete." }
          if ($artifactCount -ne 0 -and $artifactCount -ne $artifactValues.Count) { throw "The Artifact Signing configuration is incomplete." }
          $pfxEnabled = $pfxCount -eq $pfxValues.Count
          $artifactEnabled = $artifactCount -eq $artifactValues.Count
          if ($pfxEnabled -and $artifactEnabled) { throw "Configure either PFX or Artifact Signing, not both." }
          $releaseSigningEnabled = $pfxEnabled -or $artifactEnabled
          "NEVR_PFX_SIGNING_ENABLED=$($pfxEnabled.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NEVR_ARTIFACT_SIGNING_ENABLED=$($artifactEnabled.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NEVR_RELEASE_SIGNING_ENABLED=$($releaseSigningEnabled.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if (-not $releaseSigningEnabled) {
            Write-Warning "No publisher identity is configured; producing an unsigned development installer that can trigger SmartScreen."
          }

      - name: Import optional PFX Authenticode certificate
        if: env.NEVR_PFX_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "nevr-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($null -eq $certificate) { throw "The Authenticode certificate could not be imported." }

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw "signtool.exe was not found." }
          "NEVR_PFX_PATH=$pfxPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NEVR_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NEVR_SIGNTOOL=$signTool" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Azure login for Artifact Signing
        if: env.NEVR_ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign application executables with Artifact Signing
        if: env.NEVR_ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\NEVR-Anticheat-Windows-x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: NEVR-Anticheat
          description-url: https://github.com/MyGuyChromium/nevr-anticheat

      - name: Sign application executables with PFX
        if: env.NEVR_PFX_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          Get-ChildItem dist\NEVR-Anticheat-Windows-x64\*.exe | ForEach-Object {
            & $env:NEVR_SIGNTOOL sign /sha1 $env:NEVR_CERT_THUMBPRINT /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com /d "NEVR-Anticheat" $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($_.Name)" }
          }

      - name: Build portable ZIP and one-click installer
        shell: pwsh
        run: |
          $main = Get-Content -Raw cmd\desktop\main.go
          $version = [regex]::Match($main, 'const appVersion = "([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          if (-not $version) { throw "Could not determine the application version." }

          $zip = Join-Path $PWD "dist\NEVR-Anticheat-Windows-x64.zip"
          Compress-Archive -Path dist\NEVR-Anticheat-Windows-x64 -DestinationPath $zip -CompressionLevel Optimal -Force
          $zipHash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content ($zip + ".sha256") ($zipHash + "  NEVR-Anticheat-Windows-x64.zip") -Encoding ascii

          $signCommand = ""
          if ($env:NEVR_PFX_SIGNING_ENABLED -eq "true") {
            $signCommand = '$q' + $env:NEVR_SIGNTOOL + '$q sign /sha1 ' + $env:NEVR_CERT_THUMBPRINT +
              ' /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /d $qNEVR-Anticheat$q $f'
          }
          & .\scripts\build-installer.ps1 -PackageZip $zip -OutputDirectory (Join-Path $PWD "dist") `
            -Version $version -SignToolCommand $signCommand

      - name: Sign installer with Artifact Signing
        if: env.NEVR_ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\NEVR-Anticheat-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: NEVR-Anticheat Setup
          description-url: https://github.com/MyGuyChromium/nevr-anticheat

      - name: Finalize hashes and verify publisher signatures
        shell: pwsh
        run: |
          foreach ($name in @("NEVR-Anticheat-Setup.exe", "NEVR-Anticheat-Windows-x64.zip")) {
            $path = Join-Path $PWD ("dist\" + $name)
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath ($path + ".sha256") -Value ($hash + "  " + $name) -Encoding ascii
          }
          $main = Get-Content -Raw cmd\desktop\main.go
          $version = [regex]::Match($main, 'const appVersion = "([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          if (-not $version) { throw "Could not determine the application version." }
          $setupPath = Join-Path $PWD "dist\NEVR-Anticheat-Setup.exe"
          $setupHash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $releaseTag = if ($env:GITHUB_REF -eq "refs/heads/master") { "windows-latest" } else { $env:GITHUB_REF_NAME }
          $manifest = [ordered]@{
            schema_version = 1
            tag = $releaseTag
            commit = $env:GITHUB_SHA
            version = $version
            installer = [ordered]@{
              name = "NEVR-Anticheat-Setup.exe"
              sha256 = $setupHash
              size = (Get-Item -LiteralPath $setupPath).Length
            }
          } | ConvertTo-Json -Depth 4
          [IO.File]::WriteAllText(
            (Join-Path $PWD "dist\NEVR-Anticheat-Update.json"),
            $manifest + "`n",
            [Text.UTF8Encoding]::new($false)
          )
          if ($env:NEVR_RELEASE_SIGNING_ENABLED -ne "true") { exit 0 }
          $signedFiles = @((Get-ChildItem dist\NEVR-Anticheat-Windows-x64\*.exe).FullName)
          $signedFiles += (Join-Path $PWD "dist\NEVR-Anticheat-Setup.exe")
          foreach ($path in $signedFiles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne "Valid") {
              throw "Invalid publisher signature on ${path}: $($signature.Status) $($signature.StatusMessage)"
            }
            Write-Host "$([IO.Path]::GetFileName($path)): $($signature.SignerCertificate.Subject)"
          }

      - name: Scan release files with Microsoft Defender
        shell: pwsh
        run: |
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($null -eq $status -or -not $status.AMServiceEnabled) {
            Write-Warning "Microsoft Defender is unavailable on this runner; the release scan was skipped."
            exit 0
          }
          $started = Get-Date
          Start-MpScan -ScanType CustomScan -ScanPath (Join-Path $PWD "dist\NEVR-Anticheat-Windows-x64")
          Start-MpScan -ScanType CustomScan -ScanPath (Join-Path $PWD "dist\NEVR-Anticheat-Setup.exe")
          $detections = @(Get-MpThreatDetection | Where-Object { $_.InitialDetectionTime -ge $started })
          if ($detections.Count -gt 0) {
            $detections | Format-List | Out-String | Write-Error
            throw "Microsoft Defender detected a threat in the release artifacts."
          }

      - name: Smoke-test fresh installed startup, upgrade and uninstall
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne "github-hosted" -or $env:RUNNER_OS -ne "Windows") {
            throw "Installer smoke checks require a disposable GitHub-hosted Windows runner."
          }
          $installRoot = Join-Path $env:LOCALAPPDATA "Programs\NEVR-Anticheat"
          $dataRoot = Join-Path $env:LOCALAPPDATA "NEVR-Anticheat"
          foreach ($path in @($installRoot, $dataRoot)) {
            if (Test-Path -LiteralPath $path) { throw "Fresh-install smoke requires an absent path: $path" }
          }
          $setup = Join-Path $PWD "dist\NEVR-Anticheat-Setup.exe"
          $install = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent install exited with $($install.ExitCode)" }

          foreach ($file in @(
            "nevr-desktop.exe", "nevr-ac.exe", "nevr-server.exe", "nevr-bridge.exe", "nevr-compat.exe",
            "installed.toml", "nevr.ico", "configs\default.toml", "configs\shadow_deploy.toml",
            "Rollback-NEVR.cmd", "Rollback-NEVR.ps1", "Program-Snapshot.ps1"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $installRoot $file))) { throw "Installed file is missing: $file" }
          }
          $installedConfig = Join-Path $installRoot "installed.toml"
          if ((Get-Content -Raw $installedConfig) -notmatch "nevr-anticheat.db") {
            throw "Installed configuration does not point at the evidence database."
          }

          # The installer must create the data directory, and the installed
          # executable must complete its first boot before fixtures are written.
          & .\scripts\test-installed-startup.ps1 -InstallRoot $installRoot

          $evidenceMarker = Join-Path $dataRoot "installer-preservation-test.txt"
          Set-Content -LiteralPath $evidenceMarker -Value "preserve"
          Add-Content -LiteralPath $installedConfig -Value "# preserve-upgrade-settings"

          $upgrade = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -WindowStyle Hidden -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Silent upgrade exited with $($upgrade.ExitCode)" }
          if ((Get-Content -Raw $installedConfig) -notmatch "preserve-upgrade-settings") {
            throw "Upgrade replaced the existing installed configuration."
          }
          if (-not (Test-Path -LiteralPath $evidenceMarker)) { throw "Upgrade removed the evidence directory." }
          $snapshots = @(Get-ChildItem -LiteralPath (Join-Path $dataRoot "program-rollbacks") -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending)
          if ($snapshots.Count -eq 0 -or -not (Test-Path -LiteralPath (Join-Path $snapshots[0].FullName "nevr-desktop.exe"))) {
            throw "Upgrade did not create a usable program rollback snapshot."
          }

          $uninstaller = Get-ChildItem -LiteralPath $installRoot -Filter "unins*.exe" | Select-Object -First 1
          if ($null -eq $uninstaller) { throw "Windows uninstall entry was not created." }
          $uninstall = Start-Process $uninstaller.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall exited with $($uninstall.ExitCode)" }
          if (-not (Test-Path -LiteralPath $evidenceMarker)) { throw "Uninstall removed the evidence directory." }
          Remove-Item -LiteralPath $evidenceMarker -Force

      - name: Upload verified Windows release
        uses: actions/upload-artifact@v7
        with:
          name: NEVR-Anticheat-Windows
          path: |
            dist/NEVR-Anticheat-Setup.exe
            dist/NEVR-Anticheat-Setup.exe.sha256
            dist/NEVR-Anticheat-Update.json
            dist/NEVR-Anticheat-Windows-x64.zip
            dist/NEVR-Anticheat-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Attest release build provenance
        # GitHub does not offer artifact attestations to user-owned private
        # repositories. Keep them automatic when the repository is public,
        # without blocking an otherwise verified private release.
        if: ${{ !github.event.repository.private && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/NEVR-Anticheat-Setup.exe
            dist/NEVR-Anticheat-Windows-x64.zip

      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:NEVR_CERT_THUMBPRINT) {
            Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $env:NEVR_CERT_THUMBPRINT) -Force -ErrorAction SilentlyContinue
          }
          if ($env:NEVR_PFX_PATH) {
            Remove-Item -LiteralPath $env:NEVR_PFX_PATH -Force -ErrorAction SilentlyContinue
          }

  publish:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.quality_ci.result == 'success' &&
      needs.quality_security.result == 'success' &&
      needs.package.result == 'success'
    needs: [quality_ci, quality_security, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download verified release files
        uses: actions/download-artifact@v8
        with:
          name: NEVR-Anticheat-Windows
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            dist/NEVR-Anticheat-Setup.exe
            dist/NEVR-Anticheat-Setup.exe.sha256
            dist/NEVR-Anticheat-Update.json
            dist/NEVR-Anticheat-Windows-x64.zip
            dist/NEVR-Anticheat-Windows-x64.zip.sha256
          )
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            if ! gh release view "$release_tag" >/dev/null 2>&1; then
              gh release create "$release_tag" --generate-notes --title "$release_tag"
            fi
          else
            release_tag="windows-latest"
            if gh release view "$release_tag" >/dev/null 2>&1; then
              gh release edit "$release_tag" --latest --title "Latest Windows build" \
                --notes "Download NEVR-Anticheat-Setup.exe for the simplest install. The portable ZIP remains available for advanced use. This rolling release is replaced after every successful master build."
              gh release upload "$release_tag" "${assets[@]}" --clobber
              git tag --force "$release_tag" "$GITHUB_SHA"
              git push origin "refs/tags/$release_tag" --force
              exit 0
            else
              git tag --force "$release_tag" "$GITHUB_SHA"
              git push origin "refs/tags/$release_tag" --force
              gh release create "$release_tag" --latest --title "Latest Windows build" \
                --notes "Download NEVR-Anticheat-Setup.exe for the simplest install. The portable ZIP remains available for advanced use."
            fi
          fi
          gh release upload "$release_tag" "${assets[@]}" --clobber
